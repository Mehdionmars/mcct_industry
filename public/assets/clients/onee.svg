<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <g transform="translate(6, 0)">
    <!-- High-Voltage Electric Tower / Pylon Icon -->
    <g transform="translate(26, 40)">
      <!-- Energy spark glow at peak -->
      <circle cx="0" cy="-22" r="2.5" fill="#00A3E0"/>
      <!-- Main Legs & Apex -->
      <path d="M 0 -22 L -12 22 M 0 -22 L 12 22" stroke="#0055A4" stroke-width="2" stroke-linecap="round"/>
      <!-- Crossarms -->
      <line x1="-12" y1="-13" x2="12" y2="-13" stroke="#0055A4" stroke-width="2" stroke-linecap="round"/>
      <line x1="-16" y1="-5" x2="16" y2="-5" stroke="#0055A4" stroke-width="2" stroke-linecap="round"/>
      <line x1="-11" y1="5" x2="11" y2="5" stroke="#0055A4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-12" y1="22" x2="12" y2="22" stroke="#0055A4" stroke-width="2" stroke-linecap="round"/>
      <!-- Lattice Bracing -->
      <path d="M -12 22 L 0 10 L 12 22" stroke="#0055A4" stroke-width="1.4" fill="none"/>
      <path d="M -8 10 L 0 -1 L 8 10" stroke="#0055A4" stroke-width="1.4" fill="none"/>
      <path d="M -6 -1 L 0 -13 L 6 -1" stroke="#0055A4" stroke-width="1.4" fill="none"/>
      <!-- Electric energy arcs -->
      <path d="M -16 -5 C -20 -9 -21 -1 -24 -5" stroke="#00A3E0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 16 -5 C 20 -9 21 -1 24 -5" stroke="#00A3E0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Brand typography -->
    <text x="56" y="41" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#0055A4" letter-spacing="2">ONEE</text>
    <line x1="57" y1="47" x2="182" y2="47" stroke="#00A3E0" stroke-width="1.2"/>
    <text x="57" y="57" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="5.8" font-weight="800" fill="#333333" letter-spacing="0.4">OFFICE NATIONAL DE L'ÉLECTRICITÉ</text>
    <text x="57" y="66" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="5" font-weight="700" fill="#0055A4" letter-spacing="0.8">BRANCHE ÉLECTRICITÉ</text>
  </g>
</svg>
