<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <g transform="translate(6, 0)">
    <!-- Angular Heavy Engineering Geometric Shape -->
    <g transform="translate(26, 40)">
      <!-- Left angular red facet -->
      <polygon points="-16,-14 0,-24 0,0 -16,10" fill="#C8102E"/>
      <!-- Right angular blue facet -->
      <polygon points="0,-24 16,-14 16,10 0,0" fill="#003087"/>
      <!-- Bottom base facet -->
      <polygon points="-16,10 0,0 16,10 0,20" fill="#001B4E"/>
      <!-- Dynamic inner angular cut -->
      <line x1="0" y1="-24" x2="0" y2="20" stroke="#FFFFFF" stroke-width="1.8"/>
      <polygon points="-5,-4 5,-4 0,4" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <!-- Brand typography -->
    <text x="56" y="41" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#003087" letter-spacing="2">ISGEC</text>
    <rect x="57" y="47" width="130" height="1.5" fill="#C8102E"/>
    <text x="57" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="6.5" font-weight="800" fill="#C8102E" letter-spacing="1.2">HEAVY ENGINEERING LTD.</text>
  </g>
</svg>
