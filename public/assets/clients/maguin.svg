<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <g transform="translate(6, 0)">
    <!-- Geometric "F" Blocks Pattern (Moret Industries) -->
    <g transform="translate(25, 40)">
      <!-- Top Row -->
      <rect x="-12" y="-19" width="9.5" height="9.5" rx="1.5" fill="#F39200"/>
      <rect x="0.5" y="-19" width="9.5" height="9.5" rx="1.5" fill="#F39200"/>
      <rect x="13" y="-19" width="9.5" height="9.5" rx="1.5" fill="#F39200"/>
      <!-- Middle Row -->
      <rect x="-12" y="-6.5" width="9.5" height="9.5" rx="1.5" fill="#003DA5"/>
      <rect x="0.5" y="-6.5" width="9.5" height="9.5" rx="1.5" fill="#F39200"/>
      <!-- Bottom Row -->
      <rect x="-12" y="6" width="9.5" height="9.5" rx="1.5" fill="#003DA5"/>
      <!-- Base Row -->
      <rect x="-12" y="18.5" width="9.5" height="9.5" rx="1.5" fill="#003DA5"/>
    </g>
    <!-- Brand typography -->
    <text x="56" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#003DA5" letter-spacing="0.5">maguin</text>
    <line x1="57" y1="48" x2="182" y2="48" stroke="#F39200" stroke-width="1.2"/>
    <text x="57" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="6.3" font-weight="600" fill="#555555" letter-spacing="0.4">A Moret Industries Company</text>
  </g>
