# Démarrage rapide : Odoo 19 Community + PostgreSQL + module MCCT Industry.
#   cd odoo_addons && docker compose up -d
#   puis ouvrir http://localhost:8069
# Changez les mots de passe avant toute mise en production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    # L'installation du module (comptabilité marocaine, ventes, projets, français,
    # démo) dépasse la limite par défaut de 120 s par requête : on la relève.
    command: ["odoo", "--limit-time-real=1800"]
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      # Ce dossier (contenant mcct_industry) est monté comme dossier d'addons.
      - ./:/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
