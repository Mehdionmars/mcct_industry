    </g>
    <!-- Brand typography -->
    <text x="56" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#2E7D32" letter-spacing="1.2">ALF</text>
    <text x="56" y="53" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#D4A843" letter-spacing="1.2">AFRIQUIA</text>
    <text x="57" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="5.5" font-weight="700" fill="#666666" letter-spacing="1.8">NUTRITION ANIMALE</text>
